name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint code
      run: npm run lint

    - name: Type checking
      run: npx tsc --noEmit

    - name: Build application
      run: npm run build

    - name: Run Lighthouse CI (optional)
      # Uses @lhci/cli@0.13+ - uncomment and configure if needed
      # run: npx lhci autorun
      # env:
      #   LHCI_BUILD_CONTEXT__GIT_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      #   LHCI_BUILD_CONTEXT__GIT_COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
      #   LHCI_SERVER_URL: https://lhci.example.com

    - name: Deploy to Vercel
      if: github.ref == 'refs/heads/main'
      uses: amondnet/vercel-action@v20
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: ./

    - name: Deploy to Cloudflare Pages (alternative)
      # if: github.ref == 'refs/heads/main'
      # uses: cloudflare/wrangler-action@v2
      # with:
      #   apiToken: ${{ secrets.CF_API_TOKEN }}
      #   accountId: ${{ secrets.CF_ACCOUNT_ID }}
      #   projectName: ${{ secrets.CF_PROJECT_NAME }}

    - name: Notify deployment status
      if: always()
      uses: actions/github-script@v6
      with:
        script: |
          const status = '${{ job.status }}';
          const color = status === 'success' ? 'green' : 'red';
          console.log(`Deployment status: ${status}`);